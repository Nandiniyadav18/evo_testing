<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evo | GrandEvo AI Assistant</title>

<style>

/* =========================================================
   GRANDEVO EVO AI ASSISTANT
   ========================================================= */

:root{
    --navy:#061d2b;
    --navy-2:#082737;
    --navy-3:#0d3040;

    --green:#08794f;
    --green-light:#21a875;
    --green-soft:#73d5ac;

    --gold:#d9a62a;
    --gold-light:#f1d47a;

    --cream:#f7f5ef;
    --muted:#8da5ad;
    --white:#ffffff;

    --border:rgba(255,255,255,.10);
    --shadow:0 30px 80px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 72% 45%,
            rgba(11,107,69,.16),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #061b29 0%,
            #071f2d 48%,
            #08252d 100%
        );

    color:var(--white);
    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.evo-page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

.evo-grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:52px 52px;

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            rgba(0,0,0,.7) 65%,
            transparent 100%
        );

    pointer-events:none;
}

.evo-glow{
    position:absolute;
    width:550px;
    height:550px;

    right:8%;
    top:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(18,151,102,.16),
            transparent 68%
        );

    filter:blur(5px);
    pointer-events:none;
}


/* =========================================================
   TOP BRAND
   ========================================================= */

.evo-brand{
    position:absolute;

    top:34px;
    left:45px;

    display:flex;
    align-items:center;
    gap:12px;

    z-index:10;
}

.evo-brand-mark{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            var(--green-light),
            #075b40
        );

    border:1px solid rgba(255,255,255,.12);

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.evo-brand-text strong{
    display:block;

    font-size:14px;
    letter-spacing:.5px;
}

.evo-brand-text span{
    display:block;

    margin-top:2px;

    font-size:9px;
    color:var(--green-soft);
}


/* =========================================================
   ONLINE STATUS
   ========================================================= */

.evo-online{
    position:absolute;

    right:45px;
    top:34px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:13px 17px;

    border:1px solid rgba(33,168,117,.25);
    border-radius:18px;

    background:
        rgba(5,29,42,.72);

    backdrop-filter:blur(18px);

    z-index:10;
}

.online-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#4fd49b;

    box-shadow:
        0 0 0 5px rgba(79,212,155,.08),
        0 0 15px rgba(79,212,155,.5);
}

.online-text strong{
    display:block;

    color:#63d9a8;

    font-size:10px;
    letter-spacing:1.5px;
}

.online-text span{
    display:block;

    margin-top:3px;

    color:#718992;

    font-size:9px;
}


/* =========================================================
   MAIN STAGE
   ========================================================= */

.evo-stage{
    position:relative;

    min-height:100vh;

    max-width:1450px;

    margin:auto;

    display:flex;
    align-items:center;

    padding:
        80px 45px 50px;

    isolation:isolate;
}


/* =========================================================
   EVO CHARACTER AREA
   IMPORTANT:
   CHARACTER IS NOW ON THE RIGHT
   CHAT NEVER COVERS HER FACE
   ========================================================= */

.evo-character-area{
    position:absolute;

    right:8%;
    top:50%;

    width:550px;
    height:780px;

    transform:
        translateY(-48%);

    display:flex;
    align-items:flex-end;
    justify-content:center;

    z-index:2;

    pointer-events:none;
}


/* Orbit rings */

.evo-orbit{
    position:absolute;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid rgba(83,192,156,.16);

    pointer-events:none;
}

.evo-orbit.one{
    width:440px;
    height:440px;
}

.evo-orbit.two{
    width:590px;
    height:590px;

    border-color:rgba(217,166,42,.10);
}

.evo-orbit.three{
    width:730px;
    height:730px;

    border-color:rgba(88,174,234,.08);
}


/* Small orbit dots */

.evo-orbit-dot{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--gold);

    box-shadow:
        0 0 15px rgba(217,166,42,.6);
}

.dot-one{
    top:20%;
    right:20%;
}

.dot-two{
    bottom:18%;
    left:12%;

    background:var(--green-light);
}


/* Evo image */

.evo-character{
    position:relative;

    z-index:5;

    width:auto;
    height:720px;

    max-width:none;

    object-fit:contain;

    filter:
        drop-shadow(
            0 35px 35px rgba(0,0,0,.30)
        );

    animation:evoFloat 5s ease-in-out infinite;
}

@keyframes evoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}


/* =========================================================
   CHAT PANEL
   LEFT SIDE
   ========================================================= */

.evo-chat{
    position:relative;

    z-index:20;

    width:min(430px, 39vw);

    height:680px;

    margin-left:4%;

    display:flex;
    flex-direction:column;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:28px;

    background:
        linear-gradient(
            150deg,
            rgba(6,30,44,.96),
            rgba(7,27,40,.94)
        );

    box-shadow:
        0 35px 90px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(25px);

    overflow:hidden;
}


/* =========================================================
   CHAT HEADER
   ========================================================= */

.chat-header{
    min-height:78px;

    padding:16px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);
}

.chat-identity{
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-avatar{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #0c9463,
            #07563f
        );

    border:1px solid rgba(255,255,255,.12);

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}

.chat-name strong{
    display:block;

    font-size:14px;
}

.chat-name span{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:3px;

    color:#60cfa0;

    font-size:9px;
}

.header-status{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#56d79e;
}

.chat-controls{
    display:flex;
    gap:7px;
}

.chat-control{
    width:34px;
    height:34px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.06);

    color:#9bb0b8;

    cursor:pointer;

    transition:.2s ease;
}

.chat-control:hover{
    background:
        rgba(255,255,255,.11);

    color:#fff;
}


/* =========================================================
   CHAT MESSAGE AREA
   ========================================================= */

.chat-messages{
    flex:1;

    overflow-y:auto;

    padding:22px 20px;

    scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{
    width:4px;
}

.chat-messages::-webkit-scrollbar-thumb{
    background:
        rgba(255,255,255,.14);

    border-radius:20px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message-row{
    display:flex;

    margin-bottom:16px;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message-row.user{
    justify-content:flex-end;
}

.message{
    max-width:88%;

    padding:13px 15px;

    border-radius:17px;

    font-size:12px;

    line-height:1.65;
}

.message.bot{
    background:
        linear-gradient(
            145deg,
            rgba(24,59,70,.82),
            rgba(12,42,54,.82)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    border-top-left-radius:5px;
}

.message.user{
    background:
        linear-gradient(
            145deg,
            #0a8758,
            #086844
        );

    border-top-right-radius:5px;

    color:#fff;
}

.message-time{
    margin-top:6px;

    color:#6f8992;

    font-size:8px;
}

.message.user .message-time{
    color:rgba(255,255,255,.55);
}


/* =========================================================
   BOT MESSAGE LABEL
   ========================================================= */

.bot-label{
    margin-bottom:5px;

    color:#65d3a4;

    font-size:8px;
    font-weight:800;

    letter-spacing:1px;
    text-transform:uppercase;
}


/* =========================================================
   TYPING
   ========================================================= */

.typing{
    display:flex;
    align-items:center;
    gap:4px;

    width:max-content;

    padding:12px 14px;

    border-radius:16px;

    background:
        rgba(255,255,255,.045);
}

.typing span{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#65cda3;

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,
    60%,
    100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}


/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.quick-actions{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:10px;
}

.quick-btn{
    padding:9px 11px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.035);

    color:#cbd9dc;

    font-size:10px;

    cursor:pointer;

    transition:.2s ease;
}

.quick-btn:hover{
    transform:translateY(-2px);

    border-color:
        rgba(217,166,42,.42);

    background:
        rgba(217,166,42,.07);

    color:#fff;
}


/* =========================================================
   INPUT AREA
   ========================================================= */

.chat-input-area{
    padding:12px 15px 15px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(3,20,30,.80);
}

.input-wrapper{
    display:flex;
    align-items:center;
    gap:8px;

    padding:5px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    transition:.2s ease;
}

.input-wrapper:focus-within{
    border-color:
        rgba(33,168,117,.5);

    box-shadow:
        0 0 0 3px rgba(33,168,117,.06);
}

#evoInput{
    flex:1;

    min-width:0;

    height:42px;

    padding:0 12px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

#evoInput::placeholder{
    color:#647e88;
}

.send-btn{
    width:42px;
    height:42px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    color:#12212a;

    font-size:17px;
    font-weight:800;

    cursor:pointer;

    transition:.2s ease;
}

.send-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(217,166,42,.18);
}

.input-hint{
    margin-top:8px;

    color:#58727d;

    font-size:8px;

    text-align:center;
}


/* =========================================================
   LEAD STATUS PANEL
   ========================================================= */

.lead-status{
    display:none;

    position:absolute;

    right:24px;
    bottom:24px;

    width:205px;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:18px;

    background:
        rgba(5,25,37,.88);

    backdrop-filter:blur(20px);

    z-index:30;
}

.lead-status.visible{
    display:block;

    animation:
        statusIn .3s ease;
}

@keyframes statusIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.lead-status-label{
    color:#66808a;

    font-size:8px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.lead-status-title{
    margin-top:5px;

    font-size:13px;
    font-weight:700;
}

.lead-score{
    height:5px;

    margin-top:11px;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(255,255,255,.07);
}

.lead-score-fill{
    height:100%;

    width:0;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            var(--green-light),
            var(--gold)
        );

    transition:
        width .5s ease;
}

.lead-status small{
    display:block;

    margin-top:7px;

    color:#708891;

    font-size:8px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1050px){

    .evo-stage{
        padding:
            90px 25px 35px;
    }

    .evo-chat{
        width:min(400px, 48vw);
        margin-left:0;
    }

    .evo-character-area{
        right:0;
        width:52vw;
    }

    .evo-character{
        height:650px;
    }

    .evo-orbit.three{
        width:620px;
        height:620px;
    }
}


@media(max-width:800px){

    body{
        overflow:auto;
    }

    .evo-stage{
        min-height:100vh;

        display:flex;
        flex-direction:column;

        padding:
            100px 15px 30px;
    }

    .evo-brand{
        left:18px;
        top:18px;
    }

    .evo-online{
        right:18px;
        top:18px;
    }

    /*
       On tablet/mobile Evo is deliberately kept
       ABOVE the chatbot instead of behind it.
    */

    .evo-character-area{
        position:relative;

        order:1;

        right:auto;
        top:auto;

        width:100%;
        height:430px;

        transform:none;

        margin-top:10px;
    }

    .evo-character{
        height:420px;
    }

    .evo-orbit.one{
        width:300px;
        height:300px;
    }

    .evo-orbit.two{
        width:390px;
        height:390px;
    }

    .evo-orbit.three{
        width:480px;
        height:480px;
    }

    .evo-chat{
        order:2;

        width:100%;
        max-width:520px;

        height:650px;

        margin:0;

        border-radius:24px;
    }

    .lead-status{
        display:none !important;
    }
}


@media(max-width:500px){

    .evo-online{
        padding:9px 11px;
    }

    .online-text span{
        display:none;
    }

    .evo-character-area{
        height:360px;
    }

    .evo-character{
        height:360px;
    }

    .evo-chat{
        height:620px;
    }

    .chat-messages{
        padding:17px 14px;
    }

    .message{
        max-width:94%;
    }

    .quick-btn{
        font-size:9px;
    }
}

</style>
</head>


<body>

<div class="evo-page">

    <div class="evo-grid"></div>
    <div class="evo-glow"></div>


    <!-- =====================================================
         BRAND
         ===================================================== -->

    <div class="evo-brand">

        <div class="evo-brand-mark">
            EVO
        </div>

        <div class="evo-brand-text">
            <strong>GrandEvo</strong>
            <span>AI BUSINESS ASSISTANT</span>
        </div>

    </div>


    <!-- =====================================================
         ONLINE STATUS
         ===================================================== -->

    <div class="evo-online">

        <span class="online-dot"></span>

        <div class="online-text">
            <strong>EVO ONLINE</strong>
            <span>AI business assistant</span>
        </div>

    </div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="evo-stage">


        <!-- =================================================
             CHAT
             ================================================= -->

        <section class="evo-chat">

            <header class="chat-header">

                <div class="chat-identity">

                    <div class="chat-avatar">
                        EVO
                    </div>

                    <div class="chat-name">

                        <strong>Evo</strong>

                        <span>
                            <i class="header-status"></i>
                            GrandEvo AI Assistant
                        </span>

                    </div>

                </div>


                <div class="chat-controls">

                    <button
                        class="chat-control"
                        id="minimizeChat"
                        type="button"
                        title="Minimize">

                        −

                    </button>

                    <button
                        class="chat-control"
                        id="resetChat"
                        type="button"
                        title="Restart conversation">

                        ↻

                    </button>

                </div>

            </header>


            <!-- MESSAGES -->

            <div
                class="chat-messages"
                id="chatMessages">

            </div>


            <!-- INPUT -->

            <div class="chat-input-area">

                <div class="input-wrapper">

                    <input
                        id="evoInput"
                        type="text"
                        autocomplete="off"
                        placeholder="Type your message..."
                    >

                    <button
                        id="sendButton"
                        class="send-btn"
                        type="button">

                        ↑

                    </button>

                </div>

                <div class="input-hint">
                    Evo can help you explore GrandEvo, discuss a requirement or arrange a conversation.
                </div>

            </div>

        </section>


        <!-- =================================================
             EVO CHARACTER
             ================================================= -->

        <section class="evo-character-area">

            <div class="evo-orbit one"></div>
            <div class="evo-orbit two"></div>
            <div class="evo-orbit three"></div>

            <span class="evo-orbit-dot dot-one"></span>
            <span class="evo-orbit-dot dot-two"></span>


            <img
                src="assets/evo-professional.png"
                class="evo-character"
                alt="Evo - GrandEvo AI Assistant"
            >

        </section>


        <!-- =================================================
             LEAD STATUS
             ================================================= -->

        <aside
            class="lead-status"
            id="leadStatus">

            <div class="lead-status-label">
                Conversation signal
            </div>

            <div
                class="lead-status-title"
                id="leadStatusTitle">

                Exploring

            </div>

            <div class="lead-score">

                <div
                    class="lead-score-fill"
                    id="leadScoreFill">
                </div>

            </div>

            <small id="leadStatusText">
                Getting to know you
            </small>

        </aside>

    </main>

</div>


<script>
/* =========================================================
   GRANDEVO EVO — AI CONVERSATION ENGINE
   Connected to:
   http://localhost:5000/api/evo/chat
   ========================================================= */

const EVO_API = "http://localhost:5000/api/evo/chat";

const VISITOR_KEY = "grandevo_evo_visitor";
const CHAT_KEY = "grandevo_evo_chat";



/* =========================================================
   ELEMENTS
   ========================================================= */

const messages =
    document.getElementById("chatMessages");

const input =
    document.getElementById("evoInput");

const sendButton =
    document.getElementById("sendButton");

const resetButton =
    document.getElementById("resetChat");

const minimizeButton =
    document.getElementById("minimizeChat");

const leadStatus =
    document.getElementById("leadStatus");

const leadStatusTitle =
    document.getElementById("leadStatusTitle");

const leadStatusText =
    document.getElementById("leadStatusText");

const leadScoreFill =
    document.getElementById("leadScoreFill");



/* =========================================================
   VISITOR ID
   ========================================================= */

function createVisitorId(){

    return "EV-" +
        Date.now().toString(36).toUpperCase() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();

}


let visitorId =
    localStorage.getItem(VISITOR_KEY);


if(!visitorId){

    visitorId =
        createVisitorId();

    localStorage.setItem(
        VISITOR_KEY,
        visitorId
    );

}



/* =========================================================
   LOCAL SESSION
   ========================================================= */

let conversation = [];

let lead = {

    visitorId,

    name: "",

    company: "",

    industry: "",

    email: "",

    whatsapp: "",

    intent: "",

    interest: "",

    requirement: "",

    preferredContact: "",

    appointmentRequested: false,

    leadScore: 0,

    leadStatus: "Exploring"

};



/* =========================================================
   TIME
   ========================================================= */

function getTime(){

    return new Date()
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}



/* =========================================================
   FORMAT MESSAGE
   ========================================================= */

function formatMessage(text){

    if(!text)
        return "";

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\n/g,"<br>")
        .replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

}



/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(
    text,
    type,
    save = true
){

    const row =
        document.createElement("div");

    row.className =
        "message-row " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " + type;


    if(type === "bot"){

        const label =
            document.createElement("div");

        label.className =
            "bot-label";

        label.textContent =
            "EVO";

        bubble.appendChild(label);

    }


    const content =
        document.createElement("div");

    content.innerHTML =
        formatMessage(text);

    bubble.appendChild(content);


    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        getTime();

    bubble.appendChild(time);


    row.appendChild(bubble);

    messages.appendChild(row);


    messages.scrollTop =
        messages.scrollHeight;


    if(save){

        conversation.push({

            role:
                type === "user"
                    ? "user"
                    : "assistant",

            content:text

        });

        saveSession();

    }

}



/* =========================================================
   TYPING INDICATOR
   ========================================================= */

function showTyping(){

    if(
        document.getElementById(
            "typingIndicator"
        )
    ){

        return;

    }


    const row =
        document.createElement("div");

    row.className =
        "message-row";

    row.id =
        "typingIndicator";


    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;


    row.appendChild(typing);

    messages.appendChild(row);

    messages.scrollTop =
        messages.scrollHeight;

}



function removeTyping(){

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if(typing){

        typing.remove();

    }

}



/* =========================================================
   QUICK ACTIONS
   ========================================================= */

function addQuickActions(actions){

    if(!actions || !actions.length)
        return;


    const row =
        document.createElement("div");

    row.className =
        "message-row";


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "quick-actions";


    actions.forEach(action => {

        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "quick-btn";

        button.textContent =
            action.label;


        button.addEventListener(
            "click",
            () => {

                addMessage(
                    action.label,
                    "user"
                );

                sendToEvo(
                    action.value ||
                    action.label
                );

            }
        );


        wrapper.appendChild(
            button
        );

    });


    row.appendChild(
        wrapper
    );

    messages.appendChild(
        row
    );

    messages.scrollTop =
        messages.scrollHeight;

}



/* =========================================================
   SAVE SESSION
   ========================================================= */

function saveSession(){

    try{

        localStorage.setItem(
            CHAT_KEY,
            JSON.stringify({

                visitorId,

                conversation,

                lead,

                updatedAt:
                    new Date().toISOString()

            })
        );

    }
    catch(error){

        console.warn(
            "Could not save Evo session.",
            error
        );

    }

}



/* =========================================================
   LOAD SESSION
   ========================================================= */

function loadSession(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    CHAT_KEY
                )
            );


        if(
            saved &&
            saved.visitorId === visitorId
        ){

            conversation =
                saved.conversation || [];

            lead =
                {
                    ...lead,
                    ...(saved.lead || {})
                };


            conversation.forEach(item => {

                addMessage(
                    item.content,
                    item.role === "user"
                        ? "user"
                        : "bot",
                    false
                );

            });


            updateLeadStatus();


            return true;

        }

    }
    catch(error){

        console.warn(
            "Could not load Evo session.",
            error
        );

    }


    return false;

}



/* =========================================================
   LEAD STATUS
   ========================================================= */

function updateLeadStatus(){

    const score =
        Number(
            lead.leadScore ||
            lead.score ||
            0
        );


    const status =
        lead.leadStatus ||
        lead.status ||
        "Exploring";


    leadStatusTitle.textContent =
        status;


    leadScoreFill.style.width =
        Math.min(
            score,
            100
        ) + "%";


    if(status === "Hot"){

        leadStatusText.textContent =
            "High-intent conversation";

    }

    else if(status === "Warm"){

        leadStatusText.textContent =
            "Potential business interest";

    }

    else{

        leadStatusText.textContent =
            "Getting to know GrandEvo";

    }


    if(score > 0){

        leadStatus.classList.add(
            "visible"
        );

    }

}



/* =========================================================
   SYNC LEAD FROM BACKEND
   ========================================================= */

function updateLeadFromBackend(profile){

    if(!profile)
        return;


    lead = {

        ...lead,

        ...profile

    };


    updateLeadStatus();

    saveSession();

}



/* =========================================================
   AI QUICK ACTIONS
   ========================================================= */

function showUsefulActions(){

    addQuickActions([

        {
            label:"🤖 Explore AI capabilities",
            value:
                "Tell me about GrandEvo's AI capabilities."
        },

        {
            label:"💼 I have a business requirement",
            value:
                "I have a business requirement and want to discuss it."
        },

        {
            label:"📅 Talk to GrandEvo",
            value:
                "I would like to talk to the GrandEvo team."
        }

    ]);

}



/* =========================================================
   CONTACT ACTIONS
   ========================================================= */

function showContactActions(){

    addQuickActions([

        {
            label:"📧 Share my email",
            value:
                "I would like to share my email so GrandEvo can contact me."
        },

        {
            label:"📱 Share my WhatsApp",
            value:
                "I would like to share my WhatsApp number so GrandEvo can contact me."
        },

        {
            label:"💬 Continue chatting",
            value:
                "I want to continue chatting for now."
        }

    ]);

}



/* =========================================================
   SEND TO AI
   ========================================================= */

async function sendToEvo(userMessage){

    if(!userMessage)
        return;


    input.disabled = true;

    sendButton.disabled = true;


    showTyping();


    try{

        const history =
            conversation
                .slice(-20)
                .map(item => ({

                    role:
                        item.role === "assistant"
                            ? "assistant"
                            : "user",

                    content:
                        item.content

                }));


        const response =
            await fetch(
                EVO_API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            visitorId,

                            message:
                                userMessage,

                            history,

                            lead,

                            page:
                                window.location.href,

                            source:
                                "Evo AI Assistant"

                        })

                }
            );


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            throw new Error(
                data?.error ||
                "Evo backend returned an error."
            );

        }


        /*
         * Backend returns:
         * reply
         * profile
         * leadScore
         * leadStatus
         */

        const reply =
            data.reply ||
            data.message ||
            "I'm here to help. Could you tell me a little more about what you're looking for?";


        addMessage(
            reply,
            "bot"
        );


        if(data.profile){

            updateLeadFromBackend(
                data.profile
            );

        }
        else{

            updateLeadFromBackend({

                leadScore:
                    data.leadScore ||
                    0,

                leadStatus:
                    data.leadStatus ||
                    "Exploring"

            });

        }


        /*
         * The AI can tell the frontend
         * when it is appropriate to collect
         * contact information.
         */

        if(
            data.shouldAskContact === true &&
            !lead.email &&
            !lead.whatsapp
        ){

            setTimeout(
                () => {

                    showContactActions();

                },
                350
            );

        }


    }
    catch(error){

        removeTyping();


        console.error(
            "Evo AI error:",
            error
        );


        addMessage(

            "I'm having a little trouble connecting to my AI system right now. Please try again in a moment. 💚",

            "bot"

        );

    }
    finally{

        input.disabled = false;

        sendButton.disabled = false;

        input.focus();

    }

}



/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage(){

    const value =
        input.value.trim();


    if(!value)
        return;


    addMessage(
        value,
        "user"
    );


    input.value = "";


    sendToEvo(
        value
    );

}



/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);



/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================================================
   RESET
   ========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            CHAT_KEY
        );


        conversation = [];


        lead = {

            visitorId,

            name:"",
            company:"",
            industry:"",
            email:"",
            whatsapp:"",
            intent:"",
            interest:"",
            requirement:"",
            preferredContact:"",
            appointmentRequested:false,
            leadScore:0,
            leadStatus:"Exploring"

        };


        messages.innerHTML = "";


        leadStatus.classList.remove(
            "visible"
        );


        startConversation();

    }
);



/* =========================================================
   MINIMIZE
   ========================================================= */

minimizeButton.addEventListener(
    "click",
    () => {

        const chat =
            document.querySelector(
                ".evo-chat"
            );


        const current =
            chat.dataset.minimized ===
            "true";


        if(current){

            chat.style.height =
                "";

            chat.dataset.minimized =
                "false";

            minimizeButton.textContent =
                "−";

        }

        else{

            chat.style.height =
                "78px";

            chat.dataset.minimized =
                "true";

            minimizeButton.textContent =
                "+";

        }

    }
);



/* =========================================================
   START CONVERSATION
   ========================================================= */

function startConversation(){

    messages.innerHTML = "";


    /*
     * Evo now behaves like an AI assistant.
     * She does NOT force the visitor into
     * a rigid scripted questionnaire.
     */

    setTimeout(
        () => {

            addMessage(

                `Hi! I'm **Evo** 👋

I'm GrandEvo's AI business assistant.

You can ask me anything about GrandEvo, our AI capabilities, websites, automation, customer experience, business systems, or an idea you're thinking about.

And if you have a real business requirement, tell me about it naturally — I'll help you figure out the right direction.

What would you like to explore?`,

                "bot"

            );


            showUsefulActions();

        },
        300
    );

}



/* =========================================================
   INITIALIZE
   ========================================================= */

const restored =
    loadSession();


if(!restored){

    startConversation();

}
else{

    input.focus();

}

</script>
